; Permit the 25 MiB slate-audio upload plus multipart overhead in PHP-FPM.
upload_max_filesize=26M
post_max_size=27M
; Never show PHP errors/stack traces (paths) to visitors; log them instead.
; Applies to every script under admin/, including includes/ opened directly.
display_errors=Off
display_startup_errors=Off
log_errors=On
